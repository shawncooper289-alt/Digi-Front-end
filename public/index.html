<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Smart Growth Flow</title>
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #050816;
        color: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background:
          radial-gradient(circle at 25% 20%, rgba(123, 31, 194, 0.32), transparent 28rem),
          radial-gradient(circle at 75% 75%, rgba(192, 68, 223, 0.28), transparent 26rem),
          #050816;
      }

      .card {
        width: min(100%, 620px);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      p {
        margin: 0 0 1.5rem;
        color: rgba(255, 255, 255, 0.74);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 1.15rem;
        border-radius: 999px;
        color: #ffffff;
        background: linear-gradient(135deg, #111326, #7b1fc2 55%, #c044df);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
    <script>
      const base44Url = 'https://www.live-smart-growth-flow.base44.app';
      const target = new URL(base44Url);
      target.pathname = window.location.pathname;
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Opening Live Smart Growth Flow">
        <h1>Opening Live Smart Growth Flow</h1>
        <p>This Vercel frontend is configured to mirror the Base44 app. If you are not redirected automatically, open it directly.</p>
        <a href="https://www.live-smart-growth-flow.base44.app/">Open Base44 app</a>
      </section>
    </main>
  </body>
</html>
